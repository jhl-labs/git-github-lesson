<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>완성 예시 · 매출 대시보드</title>
    <!-- 튜터 사이트용 미리보기: 실습 템플릿의 대시보드 코드를 그대로 쓰고, 설정과 데이터만 샘플로 바꾼다 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="../templates/excel-dashboard/dashboard/style.css" />
    <script>
      window.DASHBOARD_CONFIG = {
        title: '상반기 매출 대시보드 (완성 예시)',
        passwordSha256: 'e889aea099222ee8301e20d92dea73b3fc708b4ff388775e20e4b830a1e3880b', // gitpages2026
        dataUrl: '../templates/excel-dashboard/sample-data/data.json',
        sessionKey: 'demo-dashboard-auth',
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous" defer></script>
  </head>
  <body>
    <div id="mount"></div>
    <script>
      // 대시보드 본문 마크업을 템플릿에서 가져와 그대로 사용 (코드 중복 방지)
      fetch('../templates/excel-dashboard/dashboard/index.html')
        .then((r) => r.text())
        .then((html) => {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          document.body.replaceChildren(...doc.body.childNodes);
          const s = document.createElement('script');
          s.src = '../templates/excel-dashboard/dashboard/app.js';
          document.body.append(s);
        });
    </script>
  </body>
</html>
